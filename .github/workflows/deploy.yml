name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get app files
        uses: actions/checkout@v4

      - name: Find and build app
        run: |
          APP_DIR="$(dirname "$(find . -name package.json -not -path '*/node_modules/*' -print -quit)")"
          echo "App found in: $APP_DIR"
          cd "$APP_DIR"
          npm install
          npm run build
          cd ..
          cp -R "$APP_DIR/dist" pages-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload finished app
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
